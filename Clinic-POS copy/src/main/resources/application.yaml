spring:
  application:
    name: demo
  datasource:
    # File-backed so a backend restart does not destroy every issued refresh
    # token and log every device out. Delete the ./data folder to reset blank.
    url: jdbc:h2:file:./data/clinicdb;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  jackson:
    property-naming-strategy: SNAKE_CASE
    mapper:
      accept-case-insensitive-enums: true

app:
  jwt:
    issuer: clinic-pos-api
    secret: ${JWT_SECRET:Q2xpbmljLVBPUy1kZXZlbG9wbWVudC1vbmx5LXNlY3JldC0yMDI2IQ==}
    access-token-minutes: 15
    refresh-token-days: 30
