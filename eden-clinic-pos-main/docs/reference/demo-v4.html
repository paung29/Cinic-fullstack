<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

    --bg:#faf9f7; --ivory:#fbfaf7; --panel:#ffffff;
    --ink:#121722; --mut:#777c86; --steel:#a5a5a5;
    --brand:#0068f9; --brand-dk:#024bb1;
    --accent:#e8f1fd; --powder:#d6e4f1; --lav:#f4f0ff;
    --line:#efefef; --chip:#f3f2ef;
    --red:#c0392b; --redbg:#fdecec; --amber:#a97a10; --amberbg:#faf1dc;
    --forest:#046645; --forestbg:#e6f2ec;
    --ai:#6736eb; --aibg:#f4f0ff;
    --sh-subtle:rgba(0,0,0,0.07) 0px 1px 1px 0px, rgba(0,0,0,0.04) 0px -1px 1px 0px inset, rgba(0,0,0,0.14) 0px 0px 0px 0.5px inset;

  *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}

  input,select,textarea{font:inherit;padding:10px 14px;border:1px solid var(--line);border-radius:var(--r-input);background:#fff;width:100%;color:var(--ink)}
  input::placeholder{color:var(--steel)}
  input:focus,select:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:transparent}
  .app{display:flex;flex-direction:column;height:100vh}

  /* ---------- split header: white brand bar + cream tab bar ---------- */
  .top{display:flex;align-items:center;gap:12px;background:#fff;color:var(--ink);padding:0 20px;height:56px;flex:none;border-bottom:1px solid var(--line)}
  .logo{font-weight:700;letter-spacing:-.2px;font-size:16px;white-space:nowrap}
  .logo small{display:block;font-weight:500;color:var(--mut);font-size:10.5px;line-height:1.2;letter-spacing:.02em}
  .top2{display:flex;align-items:center;background:var(--bg);padding:10px 14px 2px;flex:none}
  .nav{display:flex;gap:4px;overflow-x:auto;flex:1}
  .nav button{padding:9px 18px;border-radius:var(--r-btn);color:var(--mut);white-space:nowrap;font-weight:500;font-size:14px}
  .nav button:hover{color:var(--ink)}
  .nav button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:var(--sh-subtle)}
  .chip{display:flex;align-items:center;gap:7px;background:var(--chip);border-radius:var(--r-btn);padding:7px 14px;font-size:12.5px;font-weight:600;white-space:nowrap;cursor:pointer;color:var(--ink)}
  .dot{width:8px;height:8px;border-radius:50%;background:#0a9e63}
  .chip.amber{background:var(--amberbg)} .chip.amber .dot{background:#d99a1b}
  .chip.red{background:var(--redbg);color:var(--red)} .chip.red .dot{background:#e05545}
  .who{font-size:12px;color:var(--mut);text-align:right;line-height:1.25;white-space:nowrap}
  .who b,.who:first-line{color:var(--ink)}
  .main{flex:1;overflow:auto;padding:20px}
  .main.nopad{padding:0}

  /* ---------- surfaces & primitives ---------- */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-card);padding:20px;box-shadow:var(--sh-subtle)}
  .h1{font-size:20px;font-weight:650;letter-spacing:-.2px;margin-bottom:12px}
  .h2{font-size:15px;font-weight:600;margin-bottom:10px}
  .row{display:flex;gap:10px;align-items:center}
  .grow{flex:1}
  .btn{background:var(--brand);color:#fff;font-weight:500;border-radius:var(--r-btn);padding:11px 22px;text-align:center;transition:background .12s}
  .btn:hover{background:var(--brand-dk)}
  .btn:disabled{opacity:.4;cursor:default}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.ghost:hover{background:var(--ivory)}
  .btn.red{background:var(--red)} .btn.red:hover{background:#a13122}
  .btn.ai{background:var(--ai)} .btn.ai:hover{background:#5429c9}
  .btn.sm{padding:8px 15px;font-size:13.5px}
  .tag{font-size:11.5px;font-weight:600;border-radius:8px;padding:2.5px 9px;display:inline-block}
  .tag.ok{background:var(--forestbg);color:var(--forest)} .tag.low{background:var(--redbg);color:var(--red)}
  .tag.amber{background:var(--amberbg);color:var(--amber)} .tag.blue{background:var(--accent);color:var(--brand)}
  .tag.ai{background:var(--aibg);color:var(--ai)} .tag.wt{background:var(--accent);color:var(--brand)}
  .mut{color:var(--mut)} .sm{font-size:13px} .b{font-weight:600}
  .mm{font-family:'Padauk',"Noto Sans Myanmar",sans-serif;line-height:1.7}
  table{width:100%;border-collapse:collapse}
  th{font-size:12px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
  td{padding:11px 10px;border-bottom:1px solid #f5f4f1;vertical-align:top}
  tr.click{cursor:pointer} tr.click:hover{background:var(--ivory)}
  .statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-card);padding:16px;box-shadow:var(--sh-subtle)}
  .stat .v{font-size:22px;font-weight:650;letter-spacing:-.3px;margin-top:4px}
  .stat .l{font-size:11.5px;font-weight:500;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px}

  .aicard{background:var(--aibg);border:1px solid #e5dcf9;border-radius:var(--r-card);padding:18px}
  .aicard .hdr{display:flex;gap:8px;align-items:center;font-weight:650;color:var(--ai);margin-bottom:8px}
  .lockband{background:var(--ivory);border:1px solid var(--line);border-radius:12px;padding:16px;color:var(--mut)}
  .lockband b{color:var(--ink)}

  .ava{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:600;flex:none}

  .pindots{display:flex;gap:10px;justify-content:center;margin:16px 0;font-size:20px;min-height:28px;color:var(--brand)}

  /* ---------- calendar ---------- */
  .cal{display:grid;grid-template-columns:60px repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;box-shadow:var(--sh-subtle)}

  .cal .tm{background:var(--ivory);padding:7px 8px;font-size:11.5px;color:var(--steel);text-align:right}

  .appt{border-radius:10px;padding:7px 10px;font-size:12.5px;font-weight:600;cursor:pointer;border-left:3px solid var(--brand);background:var(--accent)}

  .appt.here{background:var(--amberbg);border-left-color:#d99a1b}

  .cline:hover{background:var(--ivory)}

  .tabs{display:flex;gap:4px;padding:12px 16px 0}
  .tabs button{padding:9px 18px;border-radius:var(--r-btn);font-weight:500;color:var(--mut);font-size:14px}

  .searchrow{display:flex;gap:8px;padding:12px 16px 4px}
  .catchips{display:flex;gap:6px;padding:10px 16px 4px;overflow-x:auto}
  .catchips button{padding:7px 15px;border-radius:var(--r-btn);background:#fff;border:1px solid var(--line);font-weight:500;font-size:13px;color:var(--mut)}
  .catchips button.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
  .grid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:10px;padding:14px 16px;align-content:start}
  .tile{background:#fff;border:1px solid var(--line);border-radius:var(--r-card);padding:12px;min-height:92px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;box-shadow:var(--sh-subtle);transition:border-color .12s}
  .tile:hover{border-color:var(--brand)}
  .tile .nm{font-weight:550;font-size:13.5px;line-height:1.3}
  .tile .pr{font-weight:600;color:var(--brand);font-size:13.5px;margin-top:7px}
  .tile img{width:100%;height:52px;object-fit:cover;border-radius:10px;margin-bottom:6px}
  .totalbar{border-top:1px solid var(--line);padding:14px 16px;background:#fff}
  .charge{width:100%;margin-top:10px;padding:15px;font-size:16.5px;font-weight:600}
  .disc-chips{display:flex;gap:6px;margin-top:10px}
  .disc-chips button{flex:1;padding:8px 0;border-radius:var(--r-btn);background:var(--ivory);border:1px solid var(--line);font-weight:500;font-size:12.5px;color:var(--mut)}
  .disc-chips button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  .payg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
  .payg .btn{padding:16px 8px}
  .cash-quick{display:flex;gap:7px;margin:10px 0}
  .cash-quick button{flex:1;padding:9px 0;border-radius:var(--r-btn);background:var(--ivory);border:1px solid var(--line);font-weight:600;font-size:12px}
  .paper{width:300px;margin:0 auto;background:#fff;border:1px solid var(--line);box-shadow:var(--sh-lg);border-radius:4px;padding:18px;font-family:"Courier New",monospace;font-size:12.5px;color:#1d1d1d}
  .paper .c{text-align:center}
  .paper hr{border:none;border-top:1px dashed #bbb;margin:8px 0}
  .paper .r{display:flex;justify-content:space-between}

  /* ---------- charts ---------- */
  .bars{display:flex;align-items:flex-end;gap:8px;height:110px;margin:12px 0 4px}
  .bar{flex:1;background:var(--brand);border-radius:6px 6px 2px 2px;position:relative;min-width:14px}
  .bar .bl{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:10.5px;font-weight:600;color:var(--mut)}
  .bxl{display:flex;gap:8px}
  .bxl div{flex:1;text-align:center;font-size:11px;color:var(--steel)}

  /* ---------- phone sim ---------- */
  .phone{width:270px;background:#121722;border-radius:26px;padding:14px 11px;margin:0 auto;color:#e8edf3;box-shadow:var(--sh-lg)}
  .phone .ph-h{text-align:center;font-size:12px;color:#8b99ad;margin-bottom:8px}
  .bub{background:#1e2836;border-radius:14px;padding:10px 12px;font-size:13px;margin-bottom:8px;line-height:1.4}
  .bub.me{background:#0d4dab;margin-left:34px}
  .qbtns{display:flex;gap:6px;margin-top:8px}
  .qbtns button{flex:1;background:#28374c;border-radius:12px;padding:8px 0;font-size:16px}
  .qbtns button:hover{background:#354a66}
  .thumb{width:30px;height:30px;border-radius:8px;object-fit:cover;vertical-align:middle;margin-right:6px}
  @media(max-width:900px){.cartside{width:300px}}
</style>
</head>

/* ------------- render ------------- */
const R=document.getElementById('root');
function render(){
  const ae=document.activeElement,aid=ae&&ae.id,pos=ae&&ae.selectionStart;
  if(S.screen==='login'){R.innerHTML=loginView();return}
  R.innerHTML=`<div class="app">${topbar()}
    <div class="main ${S.screen==='sale'?'nopad':''}">${({home,calendar,clients,client,sale,stocks,analytics,hub,setup})[S.screen]()}</div>
  </div>${S.modal?modalView():''}${S.phone?phoneView():''}${S.toast?`<div class="toast">${S.toast}</div>`:''}`;
  if(aid){const el=document.getElementById(aid);if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(e){}}}
  else{const bc=document.getElementById('bcin');if(bc&&S.screen==='sale'&&!S.modal)bc.focus()}
}
window.go=s=>{S.screen=s;S.modal=null;render()};
function topbar(){
  const n=outbox.length;
  const chip=!online?`<div class="chip red" onclick="netToggle()"><span class="dot"></span>Offline${n?' · '+n:''}</div>`
    :n?`<div class="chip amber"><span class="dot"></span>Sync ${n}…</div>`
    :`<div class="chip" onclick="netToggle()"><span class="dot"></span>Synced</div>`;
  const tabs=[['home','Home'],['calendar','Calendar'],['clients','Clients'],['sale','Sale'],['stocks','Stocks'],['analytics','Analytics'],['hub','Hub'],['setup','Set-up']];
  return`<div class="top">
    <div class="logo">Eden Clinic OS<small>Lashio · Myanmar</small></div>
    <div class="grow"></div>
    ${complication?`<button class="chip red" onclick="go('home')"><span class="dot"></span>1 complication</button>`:''}
    ${chip}
    <div class="who">${S.user.name}<br><span style="opacity:.75">${S.user.role}</span></div>
    <button class="chip" onclick="logout()">Log out</button>
  </div>
  <div class="top2">
    <div class="nav">${tabs.map(([k,l])=>`<button class="${S.screen===k||(k==='clients'&&S.screen==='client')?'on':''}" onclick="go('${k}')">${l}</button>`).join('')}</div>
  </div>`;
}
window.netToggle=()=>{online=!online;
  if(online&&outbox.length){toast('Back online — syncing '+outbox.length+'…');
    const t=setInterval(()=>{outbox.shift();if(!outbox.length){clearInterval(t);toast('All synced ✓')}render()},550)}
  else render()};
window.logout=()=>{if(outbox.length){toast('Blocked — '+outbox.length+' unsynced in outbox');return}S.user=null;S.screen='login';render()};

window.pk=k=>{

  if(k==='✓'){const s=stf(S.pick);
    if(S.pinIn===s.pin){S.user=s;S.screen='home';S.pick=null}else S.pinIn='';render();return}
  if(S.pinIn.length<4){S.pinIn+=k;render()}};

function digestLines(){
  const collected=sales.filter(s=>s.status==='completed').reduce((a,s)=>a+s.pays.reduce((x,p)=>x+p.amt,0),0);
  const credit=sales.filter(s=>s.status==='completed').reduce((a,s)=>a+s.credit,0);
  const better=checkins.filter(c=>c.resp==='better').length;
  const L=[
    `Good morning. ${appts.filter(a=>a.status!=='done').length} appointments remain today; Ma Thida (botox follow-up) is in the clinic now.`,
    `Collected so far: ${fm(collected)}${credit?` · new credit ${fm(credit)}`:''}.`];
  if(addons.careloop)L.push(`Care loop: ${checkins.length} check-ins this week — ${better} feeling better${complication?', ⚠ 1 complication needs a human today':', no complications'}.`);
  if(addons.insights)L.push(`Stock: Sunscreen SPF50+ hasn't sold in 45 days and is low (3 left) — restock or promo?`);
  L.push(`Ma Thida still owes ${fm(68000)} — she's here now, a good moment to settle.`);
  return L;
}

window.resolveComp=()=>{
  activities.unshift({t:now(),txt:'Complication resolved — Dr. called '+pt(complication.pt).nm+', reviewed, noted in record'});
  checkins.unshift({pt:complication.pt,svc:complication.svc,day:'T+3',resp:'worse',at:now()});
  complication=null;toast('Resolved & logged');render()};

window.ciResp=r=>{
  S.phone.step=1;S.phone.resp=r;
  if(r==='worse'){complication={pt:S.phone.pt,svc:S.phone.svc};
    activities.unshift({t:now(),txt:'⚠ 😟 WORSE reply from '+pt(S.phone.pt).nm+' — complication queue alerted'})}
  else{checkins.unshift({pt:S.phone.pt,svc:S.phone.svc,day:'T+3',resp:r,at:now()});
    activities.unshift({t:now(),txt:(r==='better'?'😊':'😐')+' Check-in reply from '+pt(S.phone.pt).nm})}
  render()};

function calendar(){
  const cols=staff.filter(s=>s.books);
  return`<div class="row" style="margin-bottom:10px"><div class="h1" style="margin:0">Today · ${dstr(todayD)}</div><div class="grow"></div>
    <button class="btn sm" onclick="bookNew()">＋ New appointment</button></div>
  <div class="cal">
    <div class="hd"></div>${cols.map(c=>`<div class="hd">${c.name}</div>`).join('')}
    ${TIMES.map(t=>`<div class="tm">${t}</div>${cols.map(c=>{
      const a=appts.find(x=>x.t===t&&x.staffId===c.id);
      return`<div class="slot" onclick="${a?'':`bookNew('${t}','${c.id}')`}">${a?`<div class="appt ${a.status}" onclick="event.stopPropagation();openAppt('${a.id}')">${pt(a.pt).nm}<div class="mut">${svc(a.svc).nm}${a.status==='here'?' · here':a.status==='done'?' · done':''}</div></div>`:''}</div>`;
    }).join('')}`).join('')}
  </div>
  <div class="mut sm" style="margin-top:8px">Tap an empty slot to book it, or an appointment to open it. Columns = staff with <code>takes_bookings</code>.</div>`;
}
window.bookNew=(t,st)=>{S.modal={type:'book',t:t||'',staffId:st||'',pt:'',svc:''};render()};
window.openAppt=id=>{S.modal={type:'appt',id};render()};
window.doBook=()=>{
  const m=S.modal;
  const p=document.getElementById('bk_pt').value, sv=document.getElementById('bk_svc').value,
        st=document.getElementById('bk_st').value, t=document.getElementById('bk_t').value;
  if(!p||!sv||!st||!t){toast('Pick patient, service, staff and time');return}
  if(appts.find(a=>a.t===t&&a.staffId===st&&a.status!=='done')){toast('That slot is taken — double-booking blocked');return}
  appts.push({id:uid(),t,staffId:st,pt:p,svc:sv,status:'booked'});
  appts.sort((a,b)=>a.t.localeCompare(b.t));
  activities.unshift({t:now(),txt:'Booked: '+pt(p).nm+' · '+svc(sv).nm+' · '+t+' with '+stf(st).name});
  if(!online)outbox.push('appt');
  S.modal=null;toast('Booked '+pt(p).nm+' at '+t+(online?'':' (queued offline)'));render()};

window.customDisc=()=>{S.modal={type:'input',title:'Custom discount %',ph:'e.g. 25',cb:v=>{
  const d=parseInt(v)||0;
  if(d>20&&S.user.role!=='admin'){askPin('Admin PIN needed','Discount above 20% needs the owner',name=>{S.cartDisc=Math.min(d,100);S.discBy=name;toast('Approved by '+name)})}
  else{S.cartDisc=Math.min(d,100);render()}}};render()};
window.addItem=id=>{
  const it=[...services,...products].find(x=>x.id===id);
  if(it.by==='weight'){S.modal={type:'weight',it};render();return}
  if(it.lot){S.modal={type:'lot',it};render();return}
  const ex=S.cart.find(l=>l.id===it.id);
  if(ex)ex.qty+=1;else S.cart.push({id:it.id,nm:it.nm,price:it.price,qty:1,fu:it.fu});
  render()};
window.scanAdd=code=>{
  code=code.trim();if(!code)return;
  const p=products.find(x=>x.barcode===code);
  if(!p){S.modal={type:'newprod',code,step:'lookup'};render();return}
  if(p.type!=='retail'){toast('⛔ '+p.nm+' is '+p.type+' stock — not sellable');return}
  addItem(p.id);toast('Scanned: '+p.nm)};
window.clearCart=()=>{S.cart=[];S.cartDisc=0;S.discBy=null;S.cartPt=null;S.cartFrom=null;render()};
window.saveTicket=()=>{S.tickets.push({id:uid(),at:now(),pt:S.cartPt,cart:S.cart,disc:S.cartDisc,by:S.user.name});clearCart();toast('Ticket saved')};
function askPin(title,why,cb){S.modal={type:'pin',title,why,entered:'',cb};render()}

function finalizeSale(pays,credit,approvedBy){
  const fu=S.cart.find(l=>l.fu);
  const s={id:uid(),no:'R-'+(receiptNo++),time:now(),pt:S.cartPt,
    lines:S.cart.map(l=>({nm:l.nm,qty:l.qty,total:lineTotal(l),lot:l.lot||null,by:l.by,unit:l.unit})),
    total:cartTotal(),pays,credit,status:'completed',disc:S.cartDisc,discBy:S.discBy,creditBy:approvedBy||null,synced:online,
    fu:fu&&S.cartPt?dstr(new Date(todayD.getTime()+fu.fu*86400000)):null};
  sales.unshift(s);
  S.cart.forEach(l=>{const p=products.find(x=>x.id===l.id);if(p)p.stock=Math.max(0,p.stock-l.qty)});
  if(S.cartPt&&credit)pt(S.cartPt).owes+=credit;
  if(s.fu)pt(S.cartPt).fu=s.fu;
  if(S.cartFrom){const a=appts.find(x=>x.id===S.cartFrom);if(a)a.status='done'}
  if(!online)outbox.push(s.id);
  activities.unshift({t:now(),txt:'Sale '+s.no+' · '+fm(s.total)+(credit?' (credit'+(approvedBy?' appr. '+approvedBy:'')+')':'')+(online?'':' · OFFLINE')});
  clearCart();S.modal={type:'receipt',sale:s};render();
}

    <div class="pindots">${'●'.repeat(m.entered.length)||'&nbsp;'}</div>
    <div class="pinrow">${[1,2,3,4,5,6,7,8,9,'⌫',0,'✓'].map(k=>`<button class="pinkey" onclick="opk('${k}')">${k}</button>`).join('')}</div>
    <div class="mut sm" style="text-align:center;margin-top:6px">Approval logged; session stays ${S.user.name}'s. (1234)</div>${close}`);
  if(m.type==='input')return ovl(`<div class="h1">${m.title}</div>
    <input id="minp" placeholder="${m.ph}" onkeydown="if(event.key==='Enter')inpOk()">
    <button class="btn" style="width:100%;margin-top:10px" onclick="inpOk()">OK</button>${close}`);
  /* booking */
  if(m.type==='book'){
    const cols=staff.filter(s=>s.books);
    const freeTimes=st=>TIMES.filter(t=>!appts.find(a=>a.t===t&&a.staffId===(st||m.staffId)&&a.status!=='done'));
    return ovl(`<div class="h1">New appointment</div>
    <div class="fld"><label>Patient</label>
      <div class="row">
        <select id="bk_pt" class="grow"><option value="">— pick —</option>${patients.map(p=>`<option value="${p.id}" ${m.pt===p.id?'selected':''}>${p.nm} · ${p.ph}${p.allergy?' ⚠':''}</option>`).join('')}</select>
        <button class="btn ghost sm" style="flex:none" onclick="newPatient('book')">＋ New patient</button>
      </div></div>
    <div class="fld"><label>Service</label><select id="bk_svc"><option value="">— pick —</option>${services.map(s=>`<option value="${s.id}">${s.nm} — ${fm(s.price)}</option>`).join('')}</select></div>
    <div class="row">
      <div class="fld grow"><label>Staff</label><select id="bk_st">${cols.map(c=>`<option value="${c.id}" ${c.id===m.staffId?'selected':''}>${c.name}</option>`).join('')}</select></div>
      <div class="fld grow"><label>Time</label><select id="bk_t">${TIMES.map(t=>`<option ${t===m.t?'selected':''}>${t}</option>`).join('')}</select></div>
    </div>
    <button class="btn" style="width:100%" onclick="doBook()">Book — confirmation goes to Telegram</button>
    <div class="mut sm" style="margin-top:8px">Double-booking a staff slot is blocked. Booking works offline (queued).</div>${close}`);
  }
  if(m.type==='appt'){const a=appts.find(x=>x.id===m.id);const p=pt(a.pt);const s=svc(a.svc);
    return ovl(`<div class="h1">${a.t} — ${p.nm}</div>
    <div class="trow"><span>Service</span><span class="b">${s.nm} <span class="mm mut">${s.mm}</span></span></div>
    <div class="trow"><span>Staff</span><span class="b">${stf(a.staffId).name}</span></div>
    ${p.allergy?`<div class="alert" style="margin:8px 0">⚠ ${p.allergy}</div>`:''}
    ${s.lot?`<div class="mut sm" style="margin:6px 0">Injectable — checkout asks for lot & expiry (DataMatrix prefills).</div>`:''}
    <div class="row" style="margin-top:10px">
      ${a.status==='booked'?`<button class="btn ghost grow" onclick="markHere('${m.id}')">Mark arrived</button>`:''}
      ${a.status!=='done'?`<button class="btn grow" onclick="chargeAppt('${m.id}')">Charge → checkout</button>`:'<span class="tag ok">completed</span>'}
      ${a.status!=='done'?`<button class="btn ghost" onclick="cancelAppt('${m.id}')">Cancel</button>`:''}
    </div>${close}`);}
  if(m.type==='pickpt'){const q=(m.q||'').toLowerCase();
    const list=patients.filter(p=>!q||p.nm.toLowerCase().includes(q)||p.ph.includes(q));
    return ovl(`<div class="h1">Attach patient</div>
    <input id="ppq" placeholder="Search name / phone" oninput="S.modal.q=this.value;render()" value="${m.q}">
    <div style="margin-top:8px">${list.map(p=>`<button class="staffbtn" onclick="S.cartPt='${p.id}';S.modal=null;render()">
      <div class="ava">${p.nm.split(' ').pop()[0]}</div><div class="grow"><div class="b">${p.nm} ${p.allergy?'⚠':''}</div>
      <div class="mut sm">${p.ph}${p.owes?` · owes ${fm(p.owes)}`:''}</div></div></button>`).join('')}</div>
    <div class="row" style="margin-top:4px">
      <button class="btn grow" onclick="newPatient(true)">＋ New patient</button>
      <button class="btn ghost grow" onclick="S.cartPt=null;S.modal=null;render()">Walk-in</button>
    </div>${close}`);}
  /* new patient form */
  if(m.type==='newpt')return ovl(`<div class="h1">New patient</div>
    <div class="fld"><label>Name *</label><input id="pt_nm" placeholder="e.g. Ma Ei Ei"></div>
    <div class="fld"><label>Phone *</label><input id="pt_ph" placeholder="09 …"><div class="mut sm" style="margin-top:3px">Server dedupes on phone — a match merges instead of duplicating.</div></div>
    <div class="row">
      <div class="fld grow"><label>Sex</label><select id="pt_sx"><option>F</option><option>M</option><option>other</option></select></div>
      <div class="fld grow"><label>Telegram?</label><select id="pt_tg"><option value="1">yes</option><option value="0">no</option></select></div>
    </div>
    <div class="fld"><label>Allergies / alert <span class="mut">(shows as red banner everywhere)</span></label><input id="pt_al" placeholder="e.g. lidocaine"></div>
    <button class="btn" style="width:100%" onclick="ptSave('${m.fromSale===true?'sale':m.fromSale==='book'?'book':'list'}')">Save patient${m.fromSale===true?' & attach to sale':m.fromSale==='book'?' & continue booking':''}</button>
    <div class="mut sm" style="margin-top:8px">Works offline — client-generated id, code assigned at sync.</div>${close}`);
  if(m.type==='weight')return ovl(`<div class="h1">${m.it.nm}</div>
    <div class="mut sm">${fm(m.it.price)} per ${m.it.unit} · enter quantity</div>
    <input id="wq" type="number" placeholder="grams" style="margin-top:8px" onkeydown="if(event.key==='Enter')wOk()">
    <button class="btn" style="width:100%;margin-top:10px" onclick="wOk()">Add</button>${close}`);
  if(m.type==='lot')return ovl(`<div class="h1">${m.it.nm}</div>
    <div class="mut sm" style="margin-bottom:8px">Injectable — lot & expiry required for traceability.</div>
    <div class="fld"><label>Lot number</label><input id="lotno" placeholder="e.g. BTX-2311"></div>
    <div class="fld"><label>Expiry</label><input id="lotex" placeholder="YYYY-MM"></div>
    <button class="btn ghost sm" style="width:100%;margin-bottom:8px" onclick="document.getElementById('lotno').value='BTX-2311';document.getElementById('lotex').value='2027-01'">⌗ Scan GS1 DataMatrix (demo prefill)</button>
    <button class="btn" style="width:100%" onclick="lotOk()">Add to cart</button>${close}`);
  if(m.type==='line'){const l=S.cart[m.i];return ovl(`<div class="h1">${l.nm}</div>
    <div class="row" style="margin-bottom:10px">
      <button class="btn ghost" onclick="S.cart[${m.i}].qty=Math.max(1,S.cart[${m.i}].qty-1);render()">−</button>
      <div class="b" style="min-width:70px;text-align:center">${l.by==='weight'?l.qty+' '+l.unit:l.qty}</div>
      <button class="btn ghost" onclick="S.cart[${m.i}].qty++;render()">＋</button>
      <div class="grow"></div><div class="b">${fm(lineTotal(l))}</div></div>
    <div class="fld"><label>Line note (laser settings, units per site…)</label><input id="lnote" value="${l.note||''}"></div>
    <div class="row">
      <button class="btn ghost grow" onclick="S.cart.splice(${m.i},1);S.modal=null;render()">Remove</button>
      <button class="btn grow" onclick="S.cart[${m.i}].note=document.getElementById('lnote').value;S.modal=null;render()">Save</button></div>`);}
  if(m.type==='tickets')return ovl(`<div class="h1">Open tickets</div>
    ${S.tickets.length?S.tickets.map((t,i)=>`<div class="trow"><span>${t.at} · ${t.pt?pt(t.pt).nm:'Walk-in'} · ${t.cart.map(l=>l.nm).join(', ')}</span>
      <span><button class="btn sm" onclick="resumeTicket(${i})">Resume</button></span></div>`).join(''):'<div class="mut">No open tickets.</div>'}${close}`);
  if(m.type==='charge'){
    const total=cartTotal();const t=parseInt((m.tendered||'').replace(/\D/g,''))||0;
    const p=S.cartPt?pt(S.cartPt):null;
    return ovl(`<div class="h1">Charge · <span style="color:var(--brand-dk)">${fm(total)}</span></div>
    ${!m.method?`<div class="payg">
        <button class="btn" onclick="S.modal.method='cash';render()">💵 Cash</button>
        <button class="btn" onclick="finalizeSale([{m:'kbzpay',amt:${total}}],0)">📱 KBZPay</button>
        <button class="btn" onclick="finalizeSale([{m:'wave',amt:${total}}],0)">📱 Wave</button>
        <button class="btn ghost" onclick="payLater()">🕐 Pay later${p?'':' <span class="sm">(needs patient)</span>'}</button>
      </div>`
    :`<div class="fld"><label>Cash received</label><input id="tnd" inputmode="numeric" value="${m.tendered}" oninput="S.modal.tendered=this.value;render()" placeholder="0"></div>
      <div class="cash-quick">${[total,Math.ceil(total/10000)*10000,Math.ceil(total/50000)*50000,Math.ceil(total/100000)*100000]
        .filter((v,i,a)=>a.indexOf(v)===i).map(v=>`<button onclick="S.modal.tendered='${v}';render()">${fm(v)}</button>`).join('')}</div>
      ${t>=total?`<div class="trow" style="font-size:17px"><span class="b">Change</span><span class="b" style="color:var(--brand-dk)">${fm(t-total)}</span></div>`:''}
      <button class="btn charge" ${t<total?'disabled':''} onclick="finalizeSale([{m:'cash',amt:${total}}],0)">Complete — print & open drawer</button>`}
    ${close}`);}
  if(m.type==='receipt'){const s=m.sale;
    return ovl(`<div class="paper" style="width:${rc.width===58?'230':'300'}px">
      ${rc.logo?'<div class="c" style="font-size:20px">✚</div>':''}
      <div class="c b">${rc.header}</div>
      <div class="c mm">${rc.sub}</div>
      <div class="c sm">${rc.phone}</div><hr>
      <div class="r"><span>${s.no}</span><span>${dstr(todayD)} ${s.time}</span></div>
      ${s.pt?`<div class="r"><span>Patient: ${pt(s.pt).nm}</span></div>`:''}<hr>
      ${s.lines.map(l=>`<div class="r"><span>${l.nm}${l.by==='weight'?` ${l.qty}${l.unit}`:l.qty>1?` ×${l.qty}`:''}</span><span>${fm(l.total)}</span></div>${l.lot?`<div class="sm">&nbsp;&nbsp;lot ${l.lot}</div>`:''}`).join('')}
      <hr>${s.disc?`<div class="r"><span>Discount</span><span>−${s.disc}%</span></div>`:''}
      <div class="r b" style="font-size:14px"><span>TOTAL</span><span>${fm(s.total)}</span></div>
      ${s.pays.map(p=>`<div class="r"><span style="text-transform:capitalize">${p.m}</span><span>${fm(p.amt)}</span></div>`).join('')}
      ${s.credit?`<div class="r b"><span>Balance due</span><span>${fm(s.credit)}</span></div>`:''}
      ${rc.fu&&s.fu?`<hr><div class="c">Next visit: ${s.fu}</div>`:''}
      ${rc.qr?'<div class="c" style="font-size:19px;letter-spacing:-2px">▩▩</div><div class="c sm">Telegram — aftercare & booking</div>':''}
      <hr><div class="c mm">${rc.footer}</div>
      <div class="c sm">${s.synced===false?'· captured offline — will sync ·':''}</div>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="btn ghost grow" onclick="toast('Canvas raster → printer (80/58mm)')">🖨 Print</button>
      <button class="btn ghost grow" onclick="toast('PNG → share to Viber')">📤 Share</button>
      ${m.reprint&&s.status!=='voided'?`<button class="btn red grow" onclick="refundSale('${s.id}')">Refund</button>`:''}
    </div>
    <button class="btn" style="width:100%;margin-top:8px" onclick="S.modal=null;render()">Done</button>`);}
  /* new product — barcode-first with PHOTO */
  if(m.type==='newprod'){
    if(m.step==='scan')return ovl(`<div class="h1">Add product</div>
      <div class="mut sm" style="margin-bottom:8px">Barcode first — or skip if it has none.</div>
      <input id="npcode" placeholder="⌗ Barcode… (try 4005900654321)" onkeydown="if(event.key==='Enter')npLookup(this.value)">
      <div class="row" style="margin-top:10px">
        <button class="btn grow" onclick="npLookup(document.getElementById('npcode').value)">Look up</button>
        <button class="btn ghost grow" onclick="S.modal={type:'newprod',code:'',step:'form',hit:null};render()">No barcode — manual</button>
      </div>${close}`);
    if(m.step==='lookup'){
      const hit=online?GLOBAL_DB[m.code]:null;
      return ovl(`<div class="h1">Barcode ${m.code}</div>
      ${!online?`<div class="mut sm" style="margin-bottom:8px">Offline — lookup unavailable; manual entry saves and syncs later.</div>`
        :hit?`<div class="lockband" style="background:#e8f1fd;border-color:#c3d9f5;color:var(--brand-dk);margin-bottom:8px">✓ Found in global barcode database:<br><b>${hit.nm}</b> · category: ${hit.cat}</div>`
        :`<div class="mut sm" style="margin-bottom:8px">Not in the global DB (normal for local & repacked stock) — manual entry.</div>`}
      <button class="btn" style="width:100%" onclick='S.modal={type:"newprod",code:"${m.code}",step:"form",hit:${hit?JSON.stringify(hit).replace(/"/g,'&quot;'):'null'}};render()'>Continue</button>${close}`);
    }
    const hit=m.hit||{};
    return ovl(`<div class="h1">New product</div>
      <div class="fld"><label>Photo</label>
        <div class="row">
          ${S.npPhoto?`<img src="${S.npPhoto}" style="width:64px;height:64px;object-fit:cover;border-radius:9px">`:'<div style="width:64px;height:64px;border-radius:9px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:22px">📷</div>'}
          <input type="file" accept="image/*" id="np_ph" style="padding:6px" onchange="npPhoto(this)">
        </div>
        <div class="mut sm" style="margin-top:4px">The thumbnail is how reception finds the right serum among six bottles.</div></div>
      <div class="fld"><label>Product name</label><input id="np_nm" value="${hit.nm||''}" placeholder="Name"></div>
      <div class="fld"><label>Barcode</label><input id="np_bc" value="${m.code||''}" placeholder="optional"></div>
      <div class="row">
        <div class="fld grow"><label>Category</label><input id="np_cat" value="${hit.cat||''}" placeholder="e.g. Skincare"></div>
        <div class="fld grow"><label>Sold by</label><select id="np_by"><option value="each">each</option><option value="weight">weight (per g)</option></select></div>
      </div>
      <div class="row">
        <div class="fld grow"><label>Buy price — cost (Ks)</label><input id="np_cost" inputmode="numeric" placeholder="e.g. 15000" oninput="npMargin()"></div>
        <div class="fld grow"><label>Sell price (Ks)</label><input id="np_pr" inputmode="numeric" placeholder="e.g. 25000" oninput="npMargin()"></div>
      </div>
      <div class="mut sm" id="np_mg" style="margin:-4px 0 8px"></div>
      <div class="fld"><label>Opening stock</label><input id="np_st" inputmode="numeric" placeholder="0"></div>
      <button class="btn" style="width:100%" onclick="npSave()">Save product</button>
      <div class="mut sm" style="margin-top:8px">Saves offline too — deduped on barcode at sync; new products flagged on Home for the owner.</div>${close}`);
  }
  if(m.type==='receive'){const p=products.find(x=>x.id===m.pid);
    return ovl(`<div class="h1">Receive stock</div>
    <div class="fld"><label>Product</label><select onchange="S.modal.pid=this.value;render()">${products.map(x=>`<option value="${x.id}" ${x.id===m.pid?'selected':''}>${x.nm}</option>`).join('')}</select></div>
    <div class="fld"><label>Quantity received</label><input id="rc_q" inputmode="numeric" placeholder="e.g. 10"></div>
    <div class="fld"><label>Buy price per unit — if it changed <span class="mut">(current: ${p.cost?fm(p.cost):'—'})</span></label><input id="rc_cost" inputmode="numeric" placeholder="leave empty to keep"></div>
    ${p.type==='injectable'?`<div class="fld"><label>Lot / expiry (scan the DataMatrix)</label><input id="rc_l" placeholder="e.g. BTX-2450 exp 2027-06"></div>`:''}
    <button class="btn" style="width:100%" onclick="rcOk()">Receive — writes a stock move</button>
    <div class="mut sm" style="margin-top:8px">Works offline via the outbox. Corrections (adjust/waste) are admin-only, online.</div>${close}`);}
  return'';
}
function ovl(inner){return`<div class="ovl" onclick="if(event.target===this){S.modal=null;render()}"><div class="modal">${inner}</div></div>`}
window.pwTry=()=>{const v=document.getElementById('pw').value;if(v.trim()==='eden'){S.elevated=true;S.modal=null;toast('Elevated for 15 minutes');render()}};
window.newPatient=fromSale=>{S.modal={type:'newpt',fromSale};render()};
window.ptSave=mode=>{
  const nm=document.getElementById('pt_nm').value.trim();
  const ph=document.getElementById('pt_ph').value.trim();
  if(!nm||!ph){toast('Name and phone are required');return}
  const dupe=patients.find(p=>p.ph.replace(/\s/g,'')===ph.replace(/\s/g,''));
  const land=id=>{
    if(mode==='sale'){S.cartPt=id;S.modal=null}
    else if(mode==='book'){S.modal={type:'book',t:'',staffId:'',pt:id}}
    else S.modal=null;
    render()};
  if(dupe){toast('Phone matches '+dupe.nm+' — merged, not duplicated');land(dupe.id);return}
  const np={id:uid(),code:'P-0000'+(patients.length+1),nm,ph,
    allergy:document.getElementById('pt_al').value.trim(),
    tg:document.getElementById('pt_tg').value==='1',history:[],fu:'',owes:0};
  patients.push(np);
  if(!online)outbox.push('patient');
  activities.unshift({t:now(),txt:'New patient: '+nm+(online?'':' (offline — will sync)')});
  toast('Patient saved: '+nm+(online?'':' (queued offline)'));land(np.id)};
window.toggleAddon=k=>{addons[k]=!addons[k];
  toast('✦ '+k+' '+(addons[k]?'enabled':'disabled — hidden across the app'));render()};
window.setRound=v=>{ROUND=parseInt(v);toast('Rounding set to '+ROUND+' Ks per line');render()};
window.setCredit=v=>{creditLimit=parseInt(v.replace(/\D/g,''))||0;toast('Credit limit: '+fm(creditLimit));render()};
window.opk=k=>{const m=S.modal;
  if(k==='⌫'){m.entered=m.entered.slice(0,-1);render();return}
  if(k==='✓'){if(m.entered==='1234'){const cb=m.cb;S.modal=null;cb('Dr. Hkawn Mai')}else{m.entered='';render()}return}
  if(m.entered.length<4){m.entered+=k;render()}};
window.inpOk=()=>{const v=document.getElementById('minp').value;const cb=S.modal.cb;S.modal=null;cb(v)};
window.wOk=()=>{const q=parseFloat(document.getElementById('wq').value)||0;if(!q)return;
  const it=S.modal.it;S.cart.push({id:it.id,nm:it.nm,price:it.price,qty:q,by:'weight',unit:it.unit});S.modal=null;render()};
window.lotOk=()=>{const lot=document.getElementById('lotno').value||'—';const it=S.modal.it;
  S.cart.push({id:it.id,nm:it.nm,price:it.price,qty:1,lot,fu:it.fu});S.modal=null;render()};
window.resumeTicket=i=>{const t=S.tickets.splice(i,1)[0];S.cart=t.cart;S.cartPt=t.pt;S.cartDisc=t.disc;S.modal=null;S.screen='sale';render()};
window.payLater=()=>{
  if(!S.cartPt){toast('Pay-later needs a named patient');return}
  const total=cartTotal();
  askPin('Credit approval','Pay-later above the credit limit needs the owner',name=>finalizeSale([],total,name))};
window.markHere=id=>{appts.find(x=>x.id===id).status='here';S.modal=null;render()};
window.cancelAppt=id=>{appts=appts.filter(x=>x.id!==id);S.modal=null;toast('Appointment cancelled — patient notified by template');render()};
window.chargeAppt=id=>{const a=appts.find(x=>x.id===id);const s=svc(a.svc);
  S.cart=[{id:s.id,nm:s.nm,price:s.price,qty:1,lot:s.lot?'BTX-2311':null,fu:s.fu}];
  S.cartPt=a.pt;S.cartFrom=id;S.modal=null;S.screen='sale';render()};
window.npLookup=code=>{code=(code||'').trim();
  if(!code){S.modal={type:'newprod',code:'',step:'form',hit:null};render();return}
  S.modal={type:'newprod',code,step:'lookup'};render()};
window.npPhoto=inp=>{const f=inp.files&&inp.files[0];if(!f)return;
  const r=new FileReader();r.onload=e=>{S.npPhoto=e.target.result;render()};r.readAsDataURL(f)};
window.npMargin=()=>{
  const c=parseInt(document.getElementById('np_cost').value)||0,pr=parseInt(document.getElementById('np_pr').value)||0;
  const el=document.getElementById('np_mg');
  el.textContent=c&&pr?`Margin: ${fm(pr-c)} per unit (${Math.round((pr-c)/pr*100)}%)`:'';};
window.npSave=()=>{
  const nm=document.getElementById('np_nm').value.trim();if(!nm){toast('Name required');return}
  const by=document.getElementById('np_by').value;
  products.push({id:uid(),cat:document.getElementById('np_cat').value||'Other',nm,
    price:parseInt(document.getElementById('np_pr').value)||0,
    cost:parseInt(document.getElementById('np_cost').value)||0,
    stock:parseInt(document.getElementById('np_st').value)||0,low:3,type:'retail',
    by,unit:by==='weight'?'g':undefined,barcode:document.getElementById('np_bc').value.trim(),
    photo:S.npPhoto||null});
  if(!online)outbox.push('newprod');
  activities.unshift({t:now(),txt:'Product added at front desk: '+nm+' — flagged for owner review'});
  S.npPhoto=null;S.modal=null;toast('Product saved'+(online?'':' (queued — offline)'));S.screen='stocks';render()};
window.rcOk=()=>{
  const p=products.find(x=>x.id===S.modal.pid);
  const q=parseInt(document.getElementById('rc_q').value)||0;if(!q)return;
  p.stock+=q;
  const nc=parseInt(document.getElementById('rc_cost').value)||0;if(nc)p.cost=nc;
  const lel=document.getElementById('rc_l');if(lel&&lel.value){p.lots=p.lots||[];p.lots.push(lel.value)}
  if(!online)outbox.push('receive');
  S.modal=null;toast('+'+q+' '+p.nm+(online?'':' (queued — offline)'));render()};
window.refundSale=id=>{
  askPin('Admin PIN needed','Refund / void writes reversing stock moves',name=>{
    const s=sales.find(x=>x.id===id);s.status='voided';s.voidBy=name;
    if(s.pt&&s.credit){pt(s.pt).owes=Math.max(0,pt(s.pt).owes-s.credit)}
    S.modal=null;activities.unshift({t:now(),txt:'Refund '+s.no+' — approved by '+name});toast('Refunded — approved by '+name);render()})};

render();
</script>
</body>
</html>
